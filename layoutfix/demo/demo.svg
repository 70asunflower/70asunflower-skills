<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 16px; font-weight: 700; fill: #111827; }
    .sub { font-size: 12px; fill: #6b7280; }
    .node-title { font-size: 14px; font-weight: 600; fill: #111827; }
    .node-sub { font-size: 11px; fill: #6b7280; }
    .pin { font-size: 10px; fill: #374151; }
    .warn { font-size: 11px; fill: #dc2626; font-weight: 600; }
    .lbl { font-size: 11px; fill: #2563eb; font-weight: 600; }
  </style>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>
<rect width="960" height="640" fill="#ffffff"/>
<text x="480" y="32" text-anchor="middle" class="title">J47 CAN 信号链路（v2 勘正版）</text>
<text x="480" y="52" text-anchor="middle" class="sub">Thor SoC（逻辑电平）→ 载板 CAN 收发器 → J47 → 外部 CAN 总线</text>
<rect x="350" y="72" width="260" height="78" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="480" y="98" text-anchor="middle" class="node-title">Thor SoC — CAN 控制器 ×4</text>
<text x="480" y="117" text-anchor="middle" class="node-sub">CAN0/CAN1 经 FSI GPIO 复用引至 J47；CAN2/CAN3 独立引脚</text>
<text x="480" y="135" text-anchor="middle" class="pin">模块内无 PHY，引脚为 3.3V CMOS 电平 DOUT/DIN</text>
<text x="360" y="144" class="pin">CAN0_DOUT G38</text>
<text x="460" y="144" class="pin">CAN0_DIN G39</text>
<text x="560" y="144" class="pin">CAN1_DOUT H37</text>
<rect x="310" y="185" width="340" height="118" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="480" y="209" text-anchor="middle" class="node-title">载板 CAN 收发器（PHY）</text>
<text x="480" y="229" text-anchor="middle" class="node-sub">BOM：TCAN1462VDRBRQ1 ×2（U1_J、U1_E）</text>
<text x="480" y="247" text-anchor="middle" class="node-sub">原理图含 TCAN1042 / TCAN1043-Q1 页 + 端接网络页 47–54</text>
<text x="480" y="271" text-anchor="middle" class="warn">⚠ 收发器与 J47 引脚确切对应关系未确认，接线前必须实测</text>
<text x="480" y="289" text-anchor="middle" class="node-sub">每路 CAN 配套 STB/EN/ERR 控制信号</text>
<rect x="330" y="338" width="300" height="62" rx="8" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="480" y="362" text-anchor="middle" class="node-title">J47 CAN Header</text>
<text x="480" y="381" text-anchor="middle" class="node-sub">26-pin · 1.27mm · Wieson AC2800 · pin 3/5=CAN0 DOUT/DIN · pin 7/9=CAN1</text>
<rect x="330" y="435" width="300" height="62" rx="8" fill="#fff7ed" stroke="#fcd34d" stroke-width="1.5"/>
<text x="480" y="459" text-anchor="middle" class="node-title">端接确认（接线前必做）</text>
<text x="480" y="478" text-anchor="middle" class="node-sub">万用表实测 pin 4/8 是否连通 CANH/CANL + 查原理图页 47–54</text>
<rect x="330" y="532" width="300" height="62" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
<text x="480" y="556" text-anchor="middle" class="node-title">外部 CAN 总线</text>
<text x="480" y="575" text-anchor="middle" class="node-sub">双绞屏蔽线 120Ω · 经典 CAN 500kbps · 两端端接</text>
<line x1="480" y1="150" x2="480" y2="185" stroke="#2563eb" stroke-width="2" marker-end="url(#a1)"/>
<line x1="480" y1="303" x2="480" y2="338" stroke="#2563eb" stroke-width="2" marker-end="url(#a1)"/>
<line x1="480" y1="400" x2="480" y2="435" stroke="#2563eb" stroke-width="2" marker-end="url(#a1)"/>
<line x1="480" y1="497" x2="480" y2="532" stroke="#2563eb" stroke-width="2" marker-end="url(#a1)"/>
<text x="940" y="630" text-anchor="end" class="sub">付琦麟 · 2026-08-26 · J47 v2.0</text>
</svg>